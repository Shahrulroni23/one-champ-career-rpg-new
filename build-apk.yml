name: Build ONE CHAMP APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'one_champ_career_rpg_final.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter source
        run: |
          rm -rf build_source
          mkdir build_source
          unzip -q one_champ_career_rpg_final.zip -d build_source
          echo "PROJECT_DIR=$(find build_source -name pubspec.yaml -printf '%h\n' | head -n 1)" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android .

      - name: Get packages
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: one-champ-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
